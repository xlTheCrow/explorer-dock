name: Build Windows Packages

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-obs32:
    name: Build OBS 32 (VS 2022)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build OBS 32 plugin
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          ./build-windows.ps1 -ObsTarget OBS32 -Configuration RelWithDebInfo

      - name: Upload OBS 32 build
        uses: actions/upload-artifact@v4
        with:
          name: explorer-dock-obs32
          path: dist/OBS32/obs-explorer-dock.*

  build-obs33:
    name: Build OBS 33 (VS 2026)
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build OBS 33 plugin
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          ./build-windows.ps1 -ObsTarget OBS33 -Configuration RelWithDebInfo

      - name: Upload OBS 33 build
        uses: actions/upload-artifact@v4
        with:
          name: explorer-dock-obs33
          path: dist/OBS33/obs-explorer-dock.*

  package:
    name: Create both ZIP packages
    runs-on: windows-2022
    needs: [build-obs32, build-obs33]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download OBS 32 build
        uses: actions/download-artifact@v4
        with:
          name: explorer-dock-obs32
          path: dist/OBS32

      - name: Download OBS 33 build
        uses: actions/download-artifact@v4
        with:
          name: explorer-dock-obs33
          path: dist/OBS33

      - name: Prepare OBS 32 and OBS 33 packages
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content "buildspec.json" -Raw | ConvertFrom-Json).version
          $obs32Root = Join-Path $PWD "package/obs32"
          $obs32Bin = Join-Path $obs32Root "obs-plugins/64bit"
          $obs32Data = Join-Path $obs32Root "data/obs-plugins/obs-explorer-dock"
          $obs32Locale = Join-Path $obs32Data "locale"
          $obs33Root = Join-Path $PWD "package/obs33/obs-explorer-dock"
          $obs33Data = Join-Path $obs33Root "data"
          $obs33Locale = Join-Path $obs33Data "locale"

          New-Item -ItemType Directory -Force -Path $obs32Bin, $obs32Locale, $obs33Locale | Out-Null

          Copy-Item "dist/OBS32/obs-explorer-dock.dll" (Join-Path $obs32Bin "obs-explorer-dock.dll") -Force
          if (Test-Path "dist/OBS32/obs-explorer-dock.pdb") {
            Copy-Item "dist/OBS32/obs-explorer-dock.pdb" (Join-Path $obs32Bin "obs-explorer-dock.pdb") -Force
          }
          Copy-Item "data/manifest.json" (Join-Path $obs32Data "manifest.json") -Force
          Copy-Item "data/locale/*" $obs32Locale -Force

          Copy-Item "dist/OBS33/obs-explorer-dock.dll" (Join-Path $obs33Root "obs-explorer-dock.dll") -Force
          if (Test-Path "dist/OBS33/obs-explorer-dock.pdb") {
            Copy-Item "dist/OBS33/obs-explorer-dock.pdb" (Join-Path $obs33Root "obs-explorer-dock.pdb") -Force
          }
          Copy-Item "data/manifest.json" (Join-Path $obs33Data "manifest.json") -Force
          Copy-Item "data/locale/*" $obs33Locale -Force

          $obs32Zip = "Explorer-Dock-v$version-OBS32-Windows-x64.zip"
          $obs33Zip = "Explorer-Dock-v$version-OBS33-Windows-x64.zip"
          Compress-Archive -Path (Join-Path $obs32Root "*") -DestinationPath $obs32Zip -Force
          Compress-Archive -Path $obs33Root -DestinationPath $obs33Zip -Force

          "obs32Zip=$obs32Zip" >> $env:GITHUB_OUTPUT
          "obs33Zip=$obs33Zip" >> $env:GITHUB_OUTPUT

      - name: Upload ready-to-install packages
        uses: actions/upload-artifact@v4
        with:
          name: Explorer-Dock-v0.2.4-Windows-x64
          path: |
            Explorer-Dock-v0.2.4-OBS32-Windows-x64.zip
            Explorer-Dock-v0.2.4-OBS33-Windows-x64.zip
