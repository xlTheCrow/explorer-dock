name: Build Windows DLL

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build OBS Explorer Dock
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          ./build-windows.ps1 -Configuration RelWithDebInfo

      - name: Prepare install package
        shell: pwsh
        run: |
          $out = Join-Path $PWD "package/obs-explorer-dock"
          New-Item -ItemType Directory -Force -Path (Join-Path $out "bin/64bit") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $out "data/locale") | Out-Null
          Copy-Item "dist/obs-explorer-dock.dll" (Join-Path $out "bin/64bit/obs-explorer-dock.dll") -Force
          if (Test-Path "dist/obs-explorer-dock.pdb") {
            Copy-Item "dist/obs-explorer-dock.pdb" (Join-Path $out "bin/64bit/obs-explorer-dock.pdb") -Force
          }
          Copy-Item "data/locale/*" (Join-Path $out "data/locale") -Force
          Compress-Archive -Path "package/obs-explorer-dock" -DestinationPath "OBS-Explorer-Dock-Windows-x64.zip" -Force

      - name: Upload ready-to-install package
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Explorer-Dock-Windows-x64
          path: |
            OBS-Explorer-Dock-Windows-x64.zip
            dist/obs-explorer-dock.dll
            dist/obs-explorer-dock.pdb
