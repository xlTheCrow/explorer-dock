name: Feature request
description: Suggest an improvement or new feature for Explorer Dock
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: idea
    attributes:
      label: Feature idea
      description: What would you like Explorer Dock to do?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Why would this be useful?
      description: Describe the workflow or problem this feature would improve.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Mockups, screenshots or implementation ideas are welcome.
